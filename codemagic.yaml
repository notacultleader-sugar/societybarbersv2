workflows:
  ios-app-store:
    name: Society Barbers iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      groups:
        - app_store_connect
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync Capacitor
        script: npm run build:mobile
      - name: Build IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
