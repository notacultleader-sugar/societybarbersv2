workflows:
  ios-app-store:
    name: Society Barbers iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: com.thesocietybarbers.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync Capacitor
        script: npm run build:mobile
      - name: Verify signing credentials
        script: |
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" || { echo "Missing APP_STORE_CONNECT_KEY_IDENTIFIER"; exit 1; }
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || { echo "Missing APP_STORE_CONNECT_PRIVATE_KEY"; exit 1; }
          test -n "$CERTIFICATE_PRIVATE_KEY" || { echo "Missing CERTIFICATE_PRIVATE_KEY"; exit 1; }
      - name: Set up signing profiles (create if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj" \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
