workflows:
  ios-app-store:
    name: Society Barbers iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: com.thesocietybarbers.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync Capacitor
        script: npm run build:mobile
      - name: Verify signing credentials
        script: |
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" || { echo "Missing APP_STORE_CONNECT_KEY_IDENTIFIER"; exit 1; }
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || { echo "Missing APP_STORE_CONNECT_PRIVATE_KEY"; exit 1; }
          test -n "$CERTIFICATE_PRIVATE_KEY" || { echo "Missing CERTIFICATE_PRIVATE_KEY"; exit 1; }
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CM_BUILD_DIR/certificate_private_key.pem"
          openssl rsa -in "$CM_BUILD_DIR/certificate_private_key.pem" -check -noout >/dev/null 2>&1 || {
            echo "CERTIFICATE_PRIVATE_KEY must contain the separate RSA-2048 PEM key, not the App Store Connect .p8 key"
            exit 1
          }
          KEY_BITS="$(openssl rsa -in "$CM_BUILD_DIR/certificate_private_key.pem" -text -noout 2>/dev/null | sed -n 's/.*Private-Key: (\([0-9][0-9]*\) bit.*/\1/p' | head -1)"
          test "$KEY_BITS" = "2048" || {
            echo "CERTIFICATE_PRIVATE_KEY is RSA-${KEY_BITS:-unknown}; Apple requires RSA-2048"
            exit 1
          }
          echo "Signing certificate key is valid RSA-2048"
      - name: Set up signing profiles (create if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CM_BUILD_DIR/certificate_private_key.pem" \
            --strict-match-identifier \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project "ios/App/App.xcodeproj" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"
          PROFILE_PATH="$(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -print -quit)"
          test -n "$PROFILE_PATH" || { echo "No App Store provisioning profile was downloaded"; exit 1; }
          security cms -D -i "$PROFILE_PATH" > "$CM_BUILD_DIR/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$CM_BUILD_DIR/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$CM_BUILD_DIR/profile.plist")"
          test -n "$PROFILE_NAME" || { echo "Downloaded profile has no name"; exit 1; }
          test -n "$TEAM_ID" || { echo "Downloaded profile has no team identifier"; exit 1; }
          printf 'Provisioning profile ready: %s\n' "$PROFILE_NAME"
          printf 'Development team ready: %s\n' "$TEAM_ID"
          printf 'PROFILE_NAME=%s\nTEAM_ID=%s\n' "$PROFILE_NAME" "$TEAM_ID" >> "$CM_ENV"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER='$PROFILE_NAME' CODE_SIGN_IDENTITY='Apple Distribution'" \
            --export-options-plist "$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
